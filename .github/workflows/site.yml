name: site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 15 * * *" # daily, 8am PDT / 7am PST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update-followers:
    # Edits pushed by hand just redeploy; only the schedule (or a manual run)
    # spends an Apify call.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh follower counts
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          if [ -z "$APIFY_TOKEN" ]; then
            echo "::warning::APIFY_TOKEN secret is not set - follower counts not refreshed."
            exit 0
          fi
          python3 scripts/update_followers.py

      - name: Commit updated counts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/accounts.json
          if git diff --cached --quiet; then
            echo "No follower changes to commit."
          else
            git commit -m "Update follower counts"
            git push
          fi

  deploy:
    needs: update-followers
    # Runs after a successful update, and on plain pushes where the update job
    # is skipped. A failed update stops the deploy so the failure stays visible.
    if: ${{ always() && (needs.update-followers.result == 'success' || needs.update-followers.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ref: main picks up the counts commit made earlier in this same run.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
